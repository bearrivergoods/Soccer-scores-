<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Soccer Points">
<title>Soccer Practice Points</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--card:#fff;--text:#171717;--muted:#6b6b6b;--line:#d8d8dc;--accent:#0a7aff}
@media(prefers-color-scheme:dark){:root{--bg:#111113;--card:#1d1d20;--text:#f5f5f7;--muted:#aaa;--line:#38383d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:700px;margin:auto;padding:14px 12px 30px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:9px;min-height:40px}
.top{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 10px}.label{font-size:11px;color:var(--muted)}.value{font-size:21px;font-weight:750}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.actions button{padding:0 11px;font-size:13px}
.list{display:flex;flex-direction:column;gap:5px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 58px 58px 76px;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 6px}
.name{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{text-align:center;font-weight:750;font-size:16px}.minus,.plus{min-height:38px;font-size:18px;font-weight:750}.plus{background:var(--accent);color:white;border-color:var(--accent)}
.head{display:grid;grid-template-columns:minmax(0,1fr) 58px 58px 76px;gap:5px;padding:0 7px 3px;color:var(--muted);font-size:10px;text-align:center}.head div:first-child{text-align:left}
.edit{margin-top:12px}.editbox{display:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px}.editbox.show{display:block}
input{width:100%;font:inherit;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text)}
.erow{display:grid;grid-template-columns:1fr 42px;gap:5px;margin-bottom:5px}
.note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.35}
@media(max-width:390px){.row,.head{grid-template-columns:minmax(0,1fr) 48px 48px 64px}.row{gap:3px;padding:4px}.name{font-size:13px}.plus,.minus{min-height:36px}}
</style>
</head>
<body>
<main>
<header><div><h1>⚽ Soccer Practice Points</h1><div class="sub">Tap + when a player earns a point</div></div><button id="sort">Sort</button></header>
<div class="top"><div class="stat"><div class="label">TODAY</div><div id="todayTotal" class="value">0</div></div><div class="stat"><div class="label">SEASON</div><div id="seasonTotal" class="value">0</div></div></div>
<div class="actions"><button id="resetToday">Reset Today</button><button id="editNames">Edit Names</button><button id="clearAll">Clear Season</button></div>
<div class="head"><div>PLAYER</div><div>TODAY</div><div>SEASON</div><div>ADD</div></div>
<div id="list" class="list"></div>
<div id="editor" class="editbox"></div>
<div class="note">Scores save automatically on this device. Use Reset Today after practice; season totals stay.</div>
</main>
<script>
const KEY="soccerPracticePointsV1";
const defaults=[
["Aaron","H"],["Andrew","W"],["Axel","R"],["Bradley","D"],["Brycen","L"],
["Carson","W"],["Chase","W"],["Conor","W"],["Connor","R"],["Finley","W"],
["Gavin","G"],["Grayson","W"],["Leo","L"],["Lincoln","K"],["Lincoln","M"],
["Matthew","G"],["Maxwell","R"],["Michael","P"],["Nicholas","N"],["Ryder","Z"],
["Weston","K"],["Wesley","P"],["Wylie","K"],["Open",""],["Open",""]
];
let data;
try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){data=null}
if(!Array.isArray(data)||data.length!==25)data=defaults.map(x=>({name:x[0],last:x[1],today:0,season:0}));
let byPoints=false;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 let arr=data.map((x,i)=>({...x,i}));
 if(byPoints)arr.sort((a,b)=>b.today-a.today||a.name.localeCompare(b.name));
 $("list").innerHTML=arr.map(x=>`<div class="row"><div class="name">${esc(x.name)}${x.last?" "+esc(x.last)+".":""}</div><div class="num">${x.today}</div><button class="minus" data-i="${x.i}">−</button><button class="plus" data-i="${x.i}">+</button></div>`).join("");
 $("todayTotal").textContent=data.reduce((s,x)=>s+x.today,0);
 $("seasonTotal").textContent=data.reduce((s,x)=>s+x.season,0);
 $("sort").textContent=byPoints?"Roster":"Sort";
}
$("list").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i;
 if(b.classList.contains("plus")){data[i].today++;data[i].season++}
 else if(data[i].today>0){data[i].today--;data[i].season=Math.max(0,data[i].season-1)}
 save();render();
});
$("sort").onclick=()=>{byPoints=!byPoints;render()};
$("resetToday").onclick=()=>{if(confirm("Reset TODAY points? Season totals will stay.")){data.forEach(x=>x.today=0);save();render()}};
$("clearAll").onclick=()=>{if(confirm("Clear ALL season totals and today's points?")){data.forEach(x=>{x.today=0;x.season=0});save();render()}};
$("editNames").onclick=()=>{
 const ed=$("editor");ed.classList.toggle("show");
 if(ed.classList.contains("show"))ed.innerHTML=data.map((x,i)=>`<div class="erow"><input data-name="${i}" value="${esc(x.name)}"><input data-last="${i}" maxlength="1" value="${esc(x.last)}"></div>`).join("");
 else ed.innerHTML="";
};
$("editor").addEventListener("input",e=>{
 if(e.dataset.name!==undefined)data[+e.dataset.name].name=e.value;
 if(e.dataset.last!==undefined)data[+e.dataset.last].last=e.value.slice(0,1).toUpperCase();
 save();render();
});
render();
</script>
</body>
</html>
